# Compose file for the legacy ``docker-compose`` v1.x binary (prod).
#
# v1.25 doesn't understand version-less compose files, so we declare
# a version explicitly. Schema kept to v3.3 (same as the eventmanager
# prod file that is known to run on the target server).
#
# Usage:
#   docker-compose -f docker-compose.v1.yml -p bktodo up --build --force-recreate -d
#
# Modern ``docker compose`` (v2) users should stick with ``./helper up``.
version: "3.3"

services:

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - mongo-data:/data/db

  app:
    build:
      context: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Reverse proxy hits the container directly on 8004 — keep host
    # and container port identical so nginx/Caddy upstream configs
    # don't have to translate.
    ports:
      - 8004:8004
    env_file:
      - .env
    environment:
      BKTODO_MONGO_HOST: mongo
      BKTODO_MONGO_DB: bktodo
      BKTODO_SECRET_KEY: change-me-in-production
    command: ["gunicorn", "--bind", "0.0.0.0:8004", "--workers", "3", "--timeout", "600", "wsgi:app"]
    depends_on:
      - mongo

volumes:
  mongo-data:
