{# Capture controls shared by the day sheet and the task inspector.

   The project <option>s carry their custom-field definitions as JSON, so
   time-entries.js can ask for exactly the right fields the moment a project is
   picked — no round trip, and the same markup works in both places. #}

{%- macro project_select(projects, selected, cls="") -%}
  <select class="form-select form-select-sm time-add-project {{ cls }}"
          title="Billing project">
    {% set ns = namespace(cur='') %}
    {% for p in projects %}
      {% if p.customer != ns.cur %}
        {% if not loop.first %}</optgroup>{% endif %}
        {% set ns.cur = p.customer %}
        <optgroup label="{{ p.customer }}">
      {% endif %}
      <option value="{{ p.id }}" {% if p.id == selected %}selected{% endif %}
              data-mode="{{ p.mode }}"
              data-fields="{{ p.fields|tojson|forceescape }}">{{ p.name }}</option>
      {% if loop.last %}</optgroup>{% endif %}
    {% endfor %}
  </select>
{%- endmacro -%}

{# Duration, or a start/end pair — the toggle swaps which one is submitted. #}
{%- macro duration_or_clock(suggest_start="") -%}
  <input type="text" class="form-control form-control-sm time-add-duration"
         style="max-width: 6.5rem;" placeholder="1h30m" autocomplete="off"
         title="90 · 1:30 · 1h30m · 1.5h">
  {# The start is pre-filled with where the last entry of the day ended, so a
     day booked by the clock chains without retyping. Each field also has a
     "now" button, which is how most of these get filled in the first place. #}
  <span class="time-add-clock d-none align-items-center gap-1">
    <input type="time" class="form-control form-control-sm time-add-start"
           style="max-width: 7rem;" title="Start" value="{{ suggest_start }}">
    <button type="button" class="btn btn-sm btn-outline-secondary tt-now px-1"
            data-target="start" title="Start = now"><i class="bi bi-clock"></i></button>
    <span class="text-muted">–</span>
    <input type="time" class="form-control form-control-sm time-add-end"
           style="max-width: 7rem;" title="End">
    <button type="button" class="btn btn-sm btn-outline-secondary tt-now px-1"
            data-target="end" title="End = now"><i class="bi bi-clock"></i></button>
  </span>
  <button type="button" class="btn btn-sm btn-outline-secondary tt-clock-toggle"
          title="Book start and end time instead of a duration">
    <i class="bi bi-clock"></i>
  </button>
{%- endmacro -%}

{# Filled by time-entries.js from the selected project's definitions. #}
{%- macro custom_fields() -%}
  <span class="tt-custom-fields d-flex gap-1 flex-wrap align-items-center flex-grow-1"
        style="min-width: 8rem;"></span>
{%- endmacro -%}
