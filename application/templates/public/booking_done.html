<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking confirmed</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ asset('css/app.css') }}">
  <style>
    .book-wrap { max-width: 640px; margin: 0 auto; padding: 4rem 1.5rem; }
    .book-when { font-size: 1.15rem; font-weight: 600; }
    .book-sub { color: var(--gv-fg4); font-size: .85rem; }
  </style>
</head>
<body>
<div class="book-wrap text-center">
  <i class="bi bi-calendar-check text-success" style="font-size: 2.5rem;"></i>
  <h1 class="h4 mt-3 mb-2">You're booked</h1>
  <p class="book-when mb-1">
    <span data-start="{{ booking.start.isoformat() }}"
          data-minutes="{{ booking.duration_minutes }}">…</span>
  </p>
  <p class="book-sub">
    {{ booking.duration_minutes }} minutes with {{ host_name }}
    {% if booking.email %}· a confirmation is on its way to {{ booking.email }}{% endif %}
  </p>
  {% if booking.note %}
    <p class="book-sub mt-3 mb-0">What you wrote: {{ booking.note }}</p>
  {% endif %}
</div>

<script>
  // Same rule as the booking page: the server sends the instant, the browser
  // says what that is where the visitor sits.
  (function () {
    var el = document.querySelector("[data-start]");
    if (!el) { return; }
    var tz;
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { tz = undefined; }
    el.textContent = new Intl.DateTimeFormat(undefined, {
      weekday: "long", day: "numeric", month: "long", year: "numeric",
      hour: "2-digit", minute: "2-digit", timeZone: tz
    }).format(new Date(el.dataset.start)) + (tz ? " (" + tz + ")" : "");
  })();
</script>
</body>
</html>
