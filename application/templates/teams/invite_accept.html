{% extends "layout/base.html" %}
{% block title %}Join {{ team.name }} · Cairn{% endblock %}
{% block content %}
<div class="card" style="max-width: 540px;">
  <div class="card-body">
    <h1 class="h5 mb-2"><i class="bi bi-people"></i> Join {{ team.name }}</h1>
    <p class="text-muted small mb-3">
      You were invited to join this team. Accepting links your account
      so the team admin can share projects with you.
    </p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="btn btn-primary">Accept &amp; join</button>
      <a href="{{ url_for('dashboard.home') }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
