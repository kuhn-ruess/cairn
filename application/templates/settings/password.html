{% extends "layout/base.html" %}
{% block title %}Change password · Cairn{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Change password</h1>

<form method="post" style="max-width: 480px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="mb-3">
    <label class="form-label" for="cur-pw">Current password</label>
    <input id="cur-pw" name="current_password" type="password" required
           class="form-control form-control-sm" autocomplete="current-password">
  </div>
  <div class="mb-3">
    <label class="form-label" for="new-pw">New password</label>
    <input id="new-pw" name="new_password" type="password" required minlength="8"
           class="form-control form-control-sm" autocomplete="new-password">
    <div class="form-text small">At least 8 characters.</div>
  </div>
  <div class="mb-3">
    <label class="form-label" for="confirm-pw">Confirm new password</label>
    <input id="confirm-pw" name="confirm_password" type="password" required minlength="8"
           class="form-control form-control-sm" autocomplete="new-password">
  </div>

  <button type="submit" class="btn btn-primary">Update password</button>
  <a class="btn btn-link" href="{{ url_for('settings.index') }}">Cancel</a>
</form>
{% endblock %}
