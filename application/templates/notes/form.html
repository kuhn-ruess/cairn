{% extends "layout/base.html" %}
{% block title %}New {{ kind }} · Cairn{% endblock %}
{% block content %}
<div class="container" style="max-width: 32rem;">
  <h1 class="h5 mb-3">
    {% if kind == 'folder' %}<i class="bi bi-folder-plus text-warning"></i> New notes folder
    {% else %}<i class="bi bi-journal-plus text-success"></i> New note{% endif %}
  </h1>
  <form method="post" action="{{ url_for('notes.new', kind=kind) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" name="title" class="form-control" autofocus
             placeholder="{% if kind == 'folder' %}e.g. Reference{% else %}Note title{% endif %}">
    </div>
    <div class="mb-3">
      <label class="form-label">Inside folder</label>
      <select name="parent" class="form-select">
        <option value="">— top level —</option>
        {% for pk, label in folder_choices %}
          <option value="{{ pk }}" {% if pk == parent_id %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Create</button>
      <a href="{{ url_for('notes.index') }}" class="btn btn-link text-muted">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
