[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn-cli"
version = "0.2.0"
description = "Command-line client for Cairn (cairn-app.de) — send tasks to your inbox from the terminal, and read what is due."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Bastian Kuhn" }]
keywords = ["cairn", "todo", "gtd", "cli", "tasks"]
dependencies = []  # pure standard library — no third-party deps

classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Scheduling",
]

[project.urls]
Homepage = "https://app.cairn-app.de/"

[project.scripts]
cairn = "cairn_cli.cli:main"

[tool.setuptools]
packages = ["cairn_cli"]
